model = "gpt-5.5"
model_reasoning_effort = "high"
model_reasoning_summary = "concise"

sandbox_mode = "workspace-write"


model_instructions_file = "~/AGENTS.md"

[projects."/home/blurrcat/workspace/gleam/chat"]
trust_level = "trusted"

[projects."/home/blurrcat/.dotfiles"]
trust_level = "trusted"

[projects."/home/blurrcat/workspace/gleam/webapp"]
trust_level = "trusted"

[projects."/home/blurrcat/workspace/gleam"]
trust_level = "trusted"

[tui]
vim_mode_default = true
notifications = false
status_line = ["model-with-reasoning", "context-remaining", "five-hour-limit", "weekly-limit", "total-input-tokens", "total-output-tokens", "task-progress"]
status_line_use_colors = true

[tui.model_availability_nux]
"gpt-5.5" = 4

[features]
memories = true
codex_git_commit = false
fast_mode = false

[memories]
disable_on_external_context = true

[shell_environment_policy]
include_only = ["PATH", "HOME"]

[history]
save = true

[analytics]
enabled = false

[feedback]
enabled = false

[notice]
hide_rate_limit_model_nudge = false
