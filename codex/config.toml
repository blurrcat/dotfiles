model = "gpt-6-luna"
model_reasoning_effort = "high"
model_reasoning_summary = "detailed"

sandbox_mode = "workspace-write"


model_instructions_file = "~/AGENTS.md"

[projects."/home/blurrcat/workspace/gleam/chat"]
trust_level = "trusted"

[projects."/home/blurrcat/.dotfiles"]
trust_level = "trusted"

[projects."/home/blurrcat/workspace/gleam/webapp"]
trust_level = "trusted"

[projects."/home/blurrcat/workspace/gleam"]
trust_level = "trusted"

[projects."/home/blurrcat/workspace/gleam/sqlight"]
trust_level = "trusted"

[projects."/home/blurrcat/workspace/chinese-visa"]
trust_level = "trusted"

[projects."/home/blurrcat/.codex"]
trust_level = "trusted"

[projects."/home/blurrcat/workspace/everchild"]
trust_level = "trusted"

[projects."/home/blurrcat/workspace/us-migration"]
trust_level = "trusted"

[tui]
animations = false
vim_mode_default = true
notifications = false
status_line = ["model-with-reasoning", "context-remaining", "five-hour-limit", "weekly-limit"]
status_line_use_colors = true
screen_reader_detection_done = true

[tui.model_availability_nux]
"gpt-5.5" = 4
gpt-6-astra = 1
"gpt-6.1-sol" = 3

[features]
memories = true
codex_git_commit = false
fast_mode = false

[memories]
disable_on_external_context = true

[shell_environment_policy]
include_only = ["PATH", "HOME"]

[history]
save = true

[analytics]
enabled = false

[feedback]
enabled = false

[notice]
hide_rate_limit_model_nudge = false

[notice.model_migrations]
"gpt-5.4-mini" = "gpt-6-luna"
