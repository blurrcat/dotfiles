model = "gpt-5.5"
model_reasoning_effort = "medium"
model_reasoning_summary = "concise"

sandbox_mode = "workspace-write"

vim_mode = true

model_instructions_file = "~/AGENTS.md"

[projects."/home/blurrcat/workspace/gleam/chat"]
trust_level = "trusted"

[tui]
animations = false
notifications = false
status_line = ["model-with-reasoning", "run-state", "context-remaining", "context-used", "five-hour-limit", "weekly-limit", "total-input-tokens", "total-output-tokens", "task-progress"]
status_line_use_colors = true

[tui.model_availability_nux]
"gpt-5.5" = 4

[features]
memories = true
codex_git_commit = false
plugin_hooks = true
fast_mode = false

[memories]
disable_on_external_context = true

[plugins."superpowers@openai-curated"]
enabled = true

[shell_environment_policy]
include_only = ["PATH", "HOME"]

[history]
save = true

[analytics]
enabled = false

[feedback]
enabled = false
